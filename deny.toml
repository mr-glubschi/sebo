# Prüfung der Rust-Abhängigkeiten mit cargo-deny:
# bekannte Sicherheitslücken, erlaubte Lizenzen, Herkunft der Crates.

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Liste gilt auch für künftige Crates, ungenutzte Einträge sind kein Fehler.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
