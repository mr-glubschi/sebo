[package]
name = "sebo"
version = "0.1.0"
edition = "2024"
description = "SEBO – Self-hosted Bookmarks"
license = "AGPL-3.0-only"
publish = false

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
getrandom = "0.4.3"
mime_guess = { version = "2.0.5", default-features = false }
qrcode = { version = "0.15.0", default-features = false }
rpassword = "7.5.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rusqlite_migration = "2.9.0"
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-rusqlite = "0.10.0"
totp-rs = { version = "6.0.0", default-features = false, features = ["otpauth", "gen_secret"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
